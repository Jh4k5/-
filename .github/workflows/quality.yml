name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The house-style rules live in eslint.config.mjs; a purple gradient or a
      # stray raw-HTML injection fails the build here rather than in review.
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

      # A change that drops performance, accessibility or SEO below 90 is
      # rejected instead of quietly shipping.
      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
